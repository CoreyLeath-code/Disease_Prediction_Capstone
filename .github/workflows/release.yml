name: Disease Capstone Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing semantic version tag to publish (for example v1.1.1)"
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

jobs:
  release-artifact:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "RELEASE_TAG must look like v1.2.3; got '${RELEASE_TAG}'" >&2
            exit 1
          fi

      - name: Build source archive
        run: |
          mkdir -p dist
          tar \
            --exclude=.git \
            --exclude=dist \
            --exclude=data \
            --exclude=models \
            --exclude=checkpoints \
            --exclude=.env \
            -czf "dist/disease-prediction-capstone-${RELEASE_TAG}.tar.gz" .

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: dist/*.tar.gz
          generate_release_notes: true

  publish-container:
    name: Publish GHCR Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Validate GHCR PAT is configured
        shell: bash
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          if [ -z "${GHCR_PAT}" ]; then
            echo "Repository secret GHCR_PAT is missing. Add a classic PAT with write:packages and read:packages under Settings > Secrets and variables > Actions." >&2
            exit 1
          fi

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PAT }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/coreyleath-code/disease-prediction-capstone
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true

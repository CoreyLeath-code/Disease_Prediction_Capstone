name: Training Pipeline Readiness

on:
  workflow_dispatch:
    inputs:
      acknowledge_non_clinical_use:
        description: "Type EDUCATIONAL_ONLY to acknowledge this is not a clinical training pipeline"
        required: true
        type: string

permissions:
  contents: read

jobs:
  readiness:
    name: Validate Training Preconditions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify responsible-use acknowledgement
        env:
          ACKNOWLEDGEMENT: ${{ inputs.acknowledge_non_clinical_use }}
        run: |
          test "${ACKNOWLEDGEMENT}" = "EDUCATIONAL_ONLY"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Validate legacy training source syntax
        run: |
          python -m compileall -q src

      - name: Document training boundary
        run: |
          cat > training-readiness.txt <<'EOF'
          The repository's public deployment uses a deterministic educational baseline.
          This workflow does not download patient data, train a model, commit artifacts,
          or claim clinical validation. A future training workflow must document data
          provenance, licensing, de-identification, leakage controls, calibration,
          subgroup evaluation, model versioning, and independent review.
          EOF

      - uses: actions/upload-artifact@v7
        with:
          name: training-readiness-boundary
          path: training-readiness.txt
